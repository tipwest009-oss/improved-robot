<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="joke-generator">
            <h1>😂 Joke Generator</h1>
            <p class="subtitle">Get a random laugh!</p>
            
            <div class="joke-display">
                <div id="jokeType" class="joke-type">Setup</div>
                <p id="jokeText" class="joke-text">Click the button below to get started!</p>
            </div>
            
            <div class="button-group">
                <button id="getJokeBtn" class="btn btn-primary">Get New Joke</button>
                <button id="shareBtn" class="btn btn-secondary" disabled>Share</button>
            </div>
            
            <div class="joke-counter">
                <p>Jokes loaded: <span id="jokeCount">0</span></p>
            </div>
            
            <div class="loader" id="loader"></div>
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
